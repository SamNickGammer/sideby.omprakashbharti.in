$kind: http-request
method: POST
url: '{{base_url}}/api/device/live'
order: 3000
headers:
  - key: Origin
    value: '{{base_url}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Reject unauthorized or invalid request", () => pm.response.to.have.status(401));
      pm.test("No shared cache", () => pm.expect(pm.response.headers.get("Cache-Control")).to.eql("no-store"));
      pm.test("Safe error shape", () => pm.expect(pm.response.json().error).to.be.a("string"));
